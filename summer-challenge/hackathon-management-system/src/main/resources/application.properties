spring.application.name=hackathon-management-system

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/hackathon_db}
spring.datasource.username=${JDBC_DATABASE_USERNAME:nishithakrishna}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

server.port=${PORT:8080}

spring.sql.init.mode=never

jwt.secret=${JWT_SECRET:HackathonMgmtSystemSecretKeyForJWT2024MustBe256BitsLong!!}
jwt.expiration=86400000
