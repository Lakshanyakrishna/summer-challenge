<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create Account - Hackathon')}"></head>
<body>
    <div class="login-container">
        <div class="login-card animate-in">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill" style="font-size: 3rem; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                <h1 class="h4 mt-3 fw-bold">Create Account</h1>
                <p style="color: var(--text-muted);">Join the hackathon platform</p>
            </div>
            <div class="glass-panel">
                <div th:if="${param.error}" class="alert alert-danger mb-3"><i class="bi bi-exclamation-triangle-fill me-2"></i>Email already registered</div>
                <form th:action="@{/register}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="bi bi-person-plus-fill"></i>Create Account</button>
                </form>
                <p class="text-center mt-4 mb-0" style="color: var(--text-muted); font-size: 0.9rem;">
                    Already have an account? <a th:href="@{/login}" style="color: var(--neon-cyan); font-weight: 600;">Sign in</a>
                </p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
