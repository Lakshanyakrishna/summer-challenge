<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Submissions - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-box-arrow-up"></i>My Submissions</h2>
            <a th:href="@{/submissions/create}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>New Submission</a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table">
                    <thead>
                        <tr><th>Hackathon</th><th>Team</th><th>Stage</th><th>Status</th><th>GitHub</th><th>Feedback</th><th>Submitted</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${submissions}">
                            <td style="color: var(--text-muted);" th:text="${s.hackathon.title}">hackathon</td>
                            <td th:text="${s.team.teamName}">team</td>
                            <td>
                                <span class="badge" th:text="${s.stage.replace('_', ' ')}"
                                      th:classappend="${s.stage == 'STAGE_1' ? 'bg-primary' : s.stage == 'STAGE_2' ? 'bg-info' : 'bg-warning'}">stage</span>
                            </td>
                            <td>
                                <span class="badge" th:text="${s.evaluationStatus}"
                                      th:classappend="${s.evaluationStatus == 'APPROVED' ? 'bg-success' : s.evaluationStatus == 'REJECTED' ? 'bg-danger' : s.evaluationStatus.startsWith('WINNER_') ? 'bg-warning' : 'bg-secondary'}">status</span>
                            </td>
                            <td><a th:href="${s.githubLink}" target="_blank" class="btn btn-sm btn-outline-primary" th:if="${s.githubLink}"><i class="bi bi-github"></i></a></td>
                            <td style="color: var(--text-muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" th:text="${s.adminFeedback ?: '-'}">feedback</td>
                            <td style="color: var(--text-muted); font-size: 0.85rem;" th:text="${#temporals.format(s.submittedAt, 'MMM dd, HH:mm')}">date</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(submissions)}" class="empty-state">
            <i class="bi bi-box-arrow-up"></i>
            <p>No submissions yet.</p>
            <a th:href="@{/submissions/create}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Submit Project</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
