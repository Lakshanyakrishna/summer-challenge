<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create Team - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <h2><i class="bi bi-plus-circle"></i>Create Team</h2>
                <div class="card">
                    <div class="card-body p-4">
                        <p style="color: var(--text-muted); font-size: 0.88rem;" class="mb-4">
                            <i class="bi bi-info-circle me-1" style="color: var(--neon-cyan);"></i>
                            You can only create teams for hackathons where your payment is verified.
                        </p>
                        <form th:action="@{/teams/create}" th:object="${teamDto}" method="post">
                            <div class="mb-3">
                                <label for="teamName" class="form-label">Team Name</label>
                                <input type="text" id="teamName" th:field="*{teamName}" class="form-control" placeholder="Enter a creative team name" required>
                            </div>
                            <div class="mb-4">
                                <label for="hackathonId" class="form-label">Hackathon</label>
                                <select id="hackathonId" th:field="*{hackathonId}" class="form-select" required>
                                    <option value="">-- Select Hackathon --</option>
                                    <option th:each="h : ${hackathons}" th:value="${h.id}" th:text="${h.title}">hackathon</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3">
                                <i class="bi bi-people me-1"></i>Create Team
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
