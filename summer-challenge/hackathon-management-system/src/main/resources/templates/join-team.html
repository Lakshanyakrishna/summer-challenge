<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Join Team - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <h2><i class="bi bi-box-arrow-in-right"></i>Join Team</h2>
                <div class="card">
                    <div class="card-body p-4">
                        <p style="color: var(--text-muted); font-size: 0.88rem;" class="mb-4">
                            <i class="bi bi-info-circle me-1" style="color: var(--neon-cyan);"></i>
                            You can only join teams in hackathons where your payment is verified.
                        </p>
                        <form th:action="@{/teams/join}" method="post">
                            <div class="mb-3">
                                <label for="hackathonSelect" class="form-label">Hackathon</label>
                                <select id="hackathonSelect" class="form-select" onchange="loadTeams(this.value)">
                                    <option value="">-- Select Hackathon --</option>
                                    <option th:each="h : ${hackathons}" th:value="${h.id}" th:text="${h.title}">hackathon</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="teamId" class="form-label">Team</label>
                                <select id="teamId" name="teamId" class="form-select" required disabled>
                                    <option value="">-- Select Hackathon First --</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-3">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Join Team
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function loadTeams(hackathonId) {
            const teamSelect = document.getElementById('teamId');
            if (!hackathonId) {
                teamSelect.innerHTML = '<option value="">-- Select Hackathon First --</option>';
                teamSelect.disabled = true;
                return;
            }
            fetch('/teams/hackathon/' + hackathonId + '/json')
                .then(r => r.json())
                .then(teams => {
                    teamSelect.innerHTML = '<option value="">-- Select Team --</option>';
                    teams.forEach(t => {
                        teamSelect.innerHTML += '<option value="' + t.id + '">' + t.teamName + ' (by ' + t.leaderName + ')</option>';
                    });
                    if (teams.length === 0) teamSelect.innerHTML += '<option value="" disabled>No teams available</option>';
                    teamSelect.disabled = false;
                });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
