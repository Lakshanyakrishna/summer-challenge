<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Submit Project - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <h2><i class="bi bi-cloud-arrow-up"></i>Submit Project</h2>
                <div class="card mb-3">
                    <div class="card-body p-3" style="background: rgba(0, 240, 255, 0.04);">
                        <p class="mb-0 small" style="color: var(--text-muted);">
                            <i class="bi bi-info-circle me-1" style="color: var(--neon-cyan);"></i>
                            Submissions progress through stages: <strong>Stage 1</strong> → <strong>Stage 2</strong> → <strong>Final Pitch</strong>.
                            Each stage requires admin approval before proceeding.
                        </p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body p-4">
                        <form th:action="@{/submissions/create}" th:object="${submissionDto}" method="post">
                            <div class="mb-3">
                                <label for="teamId" class="form-label">Team</label>
                                <select id="teamId" th:field="*{teamId}" class="form-select" required>
                                    <option value="">-- Select Team --</option>
                                    <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.teamName} + ' (' + ${t.hackathon.title} + ')'">team</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="hackathonId" class="form-label">Hackathon</label>
                                <select id="hackathonId" th:field="*{hackathonId}" class="form-select" required>
                                    <option value="">-- Select Hackathon --</option>
                                    <option th:each="t : ${teams}" th:value="${t.hackathon.id}" th:text="${t.hackathon.title}">hackathon</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="githubLink" class="form-label">GitHub Repository</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-github"></i></span>
                                    <input type="url" id="githubLink" th:field="*{githubLink}" class="form-control" placeholder="https://github.com/user/repo" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="demoLink" class="form-label">Demo URL <span style="color: var(--text-muted);">(optional)</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
                                    <input type="url" id="demoLink" th:field="*{demoLink}" class="form-control" placeholder="https://your-demo.com">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3">
                                <i class="bi bi-cloud-arrow-up me-2"></i>Submit Project
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
