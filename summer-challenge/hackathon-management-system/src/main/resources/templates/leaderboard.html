<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Leaderboard - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container py-4">
        <h2><i class="bi bi-bar-chart-fill"></i>Leaderboard</h2>

        <div class="card mb-4">
            <div class="card-body">
                <form method="get" th:action="@{/leaderboard}" class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label for="hackathonId" class="form-label">Hackathon</label>
                        <select id="hackathonId" name="hackathonId" class="form-select">
                            <option value="">-- All --</option>
                            <option th:each="h : ${hackathons}" th:value="${h.id}" th:text="${h.title}" th:selected="${h.id == selectedHackathonId}">hackathon</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-filter me-1"></i>Filter</button>
                    </div>
                </form>
            </div>
        </div>

        <div th:if="${winners != null}">
            <div class="card">
                <div class="card-header"><i class="bi bi-trophy-fill" style="color: var(--neon-yellow);"></i> Winners</div>
                <div class="card-body p-0">
                    <table class="table">
                        <thead><tr><th>Rank</th><th>Team</th><th>Hackathon</th><th>Stage</th></tr></thead>
                        <tbody>
                            <tr th:each="w : ${winners}">
                                <td>
                                    <span class="badge fs-6 px-3 py-2"
                                          th:classappend="${w.evaluationStatus == 'WINNER_1' ? 'bg-warning' : w.evaluationStatus == 'WINNER_2' ? 'bg-secondary' : 'bg-danger'}"
                                          th:text="${w.evaluationStatus.replace('WINNER_', '#')}">rank</span>
                                </td>
                                <td><strong th:text="${w.team.teamName}">team</strong></td>
                                <td style="color: var(--text-muted);" th:text="${w.hackathon.title}">hackathon</td>
                                <td><span class="badge bg-primary">Final Pitch</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(winners)}" class="empty-state">
                <i class="bi bi-trophy"></i>
                <p>No winners selected yet for this hackathon.</p>
            </div>
        </div>
        <div th:if="${winners == null}" class="text-center py-5">
            <i class="bi bi-bar-chart" style="font-size: 3.5rem; color: var(--text-muted); opacity: 0.5;"></i>
            <p style="color: var(--text-muted); margin-top: 16px;">Select a hackathon to view winners.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
