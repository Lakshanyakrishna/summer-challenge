<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign In - Hackathon')}"></head>
<body>
    <div class="login-container">
        <div class="login-card animate-in">
            <div class="text-center mb-4">
                <i class="bi bi-trophy-fill" style="font-size: 3rem; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                <h1 class="h4 mt-3 fw-bold">Welcome Back</h1>
                <p style="color: var(--text-muted);">Sign in to your account</p>
            </div>
            <div class="glass-panel">
                <div th:if="${param.error}" class="alert alert-danger mb-3"><i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid credentials</div>
                <div th:if="${param.logout}" class="alert alert-info mb-3"><i class="bi bi-info-circle-fill me-2"></i>You've been logged out</div>
                <div th:if="${param.registered}" class="alert alert-success mb-3"><i class="bi bi-check-circle-fill me-2"></i>Account created. Sign in below.</div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="username" class="form-control" placeholder="you@example.com" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="bi bi-box-arrow-in-right"></i>Sign In</button>
                </form>
                <p class="text-center mt-4 mb-0" style="color: var(--text-muted); font-size: 0.9rem;">
                    New here? <a th:href="@{/register}" style="color: var(--neon-cyan); font-weight: 600;">Create an account</a>
                </p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
