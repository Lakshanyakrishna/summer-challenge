<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Submission - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container" style="padding: 40px 0 60px; max-width: 720px;">
        <div class="text-center mb-4 animate-in">
            <h2><i class="bi bi-send"></i> Submit Your Project</h2>
            <p style="color: var(--text-muted);">Fill in the details for each stage of your submission</p>
        </div>

        <!-- Step Indicator -->
        <div class="step-indicator animate-in-delay-1">
            <div class="step active" data-step="1">
                <div class="step-circle">1</div>
                <div class="step-label">Idea Pitch</div>
            </div>
            <div class="step" data-step="2">
                <div class="step-circle">2</div>
                <div class="step-label">MVP</div>
            </div>
            <div class="step" data-step="3">
                <div class="step-circle">3</div>
                <div class="step-label">Final Pitch</div>
            </div>
        </div>

        <!-- Stage 1: Idea Pitch -->
        <div class="glass-panel step-panel animate-in-delay-2" id="panel1">
            <h5 style="margin-bottom: 20px;"><i class="bi bi-lightbulb" style="color: var(--neon-cyan);"></i> Stage 1: Idea Pitch</h5>
            <div class="mb-3">
                <label class="form-label">Project Title</label>
                <input type="text" id="projectTitle" class="form-control" placeholder="Enter your project name">
            </div>
            <div class="mb-3">
                <label class="form-label">Project Description</label>
                <textarea id="projectDesc" class="form-control" rows="3" placeholder="Brief description of your idea"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Pitch Video URL</label>
                <input type="url" id="videoUrl1" class="form-control" placeholder="YouTube / Drive video link">
            </div>
            <div class="mb-3">
                <label class="form-label">Presentation URL</label>
                <input type="url" id="pptUrl1" class="form-control" placeholder="Google Slides / PDF link">
            </div>
            <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-primary btn-lg" onclick="submitStep(1)"><i class="bi bi-send"></i> Submit Stage 1</button>
            </div>
        </div>

        <!-- Stage 2: MVP -->
        <div class="glass-panel step-panel animate-in-delay-2" id="panel2" style="display:none;">
            <h5 style="margin-bottom: 20px;"><i class="bi bi-code-slash" style="color: var(--neon-purple);"></i> Stage 2: MVP Implementation</h5>
            <div class="mb-3">
                <label class="form-label">GitHub Repository URL</label>
                <input type="url" id="githubUrl" class="form-control" placeholder="https://github.com/username/repo">
            </div>
            <div class="mb-3">
                <label class="form-label">Live Deployment URL</label>
                <input type="url" id="deployUrl" class="form-control" placeholder="https://your-app.vercel.app">
            </div>
            <div class="mb-3">
                <label class="form-label">Tech Stack</label>
                <input type="text" id="techStack" class="form-control" placeholder="e.g. React, Node.js, PostgreSQL">
            </div>
            <div class="d-flex justify-content-between">
                <button class="btn btn-ghost btn-lg" onclick="prevStep(2)"><i class="bi bi-arrow-left"></i> Back</button>
                <button class="btn btn-primary btn-lg" onclick="submitStep(2)"><i class="bi bi-send"></i> Submit Stage 2</button>
            </div>
        </div>

        <!-- Stage 3: Final Pitch -->
        <div class="glass-panel step-panel animate-in-delay-2" id="panel3" style="display:none;">
            <h5 style="margin-bottom: 20px;"><i class="bi bi-camera-video" style="color: var(--neon-green);"></i> Stage 3: Final Pitch</h5>
            <div class="mb-3">
                <label class="form-label">Final Pitch Video URL</label>
                <input type="url" id="videoUrl3" class="form-control" placeholder="YouTube / Drive video link">
            </div>
            <div class="mb-3">
                <label class="form-label">Final Presentation URL</label>
                <input type="url" id="pptUrl3" class="form-control" placeholder="Google Slides / PDF link">
            </div>
            <div class="mb-3">
                <label class="form-label">Google Meet Link</label>
                <input type="url" id="meetUrl" class="form-control" placeholder="https://meet.google.com/xxx-xxxx-xxx">
            </div>
            <div class="d-flex justify-content-between">
                <button class="btn btn-ghost btn-lg" onclick="prevStep(3)"><i class="bi bi-arrow-left"></i> Back</button>
                <button class="btn btn-success btn-lg" onclick="submitStep(3)"><i class="bi bi-send"></i> Submit Final Pitch</button>
            </div>
        </div>

        <!-- Success State -->
        <div id="successState" style="display:none;" class="text-center animate-in">
            <div class="glass-panel" style="padding: 48px 24px;">
                <i class="bi bi-check-circle-fill" style="font-size: 4rem; color: var(--neon-green); margin-bottom: 16px; display: block;"></i>
                <h4>Submission Successful!</h4>
                <p style="color: var(--text-muted); margin-bottom: 24px;">Your project has been submitted for evaluation</p>
                <a th:href="@{/dashboard}" class="btn btn-primary btn-lg"><i class="bi bi-speedometer2"></i> Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script>
    const API = '/api';
    let teamData = null;
    let currentStep = 1;

    function api(path, opts = {}) {
        return fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } }).then(r => r.json());
    }

    function showStep(step) {
        document.querySelectorAll('.step-panel').forEach(p => p.style.display = 'none');
        document.getElementById('panel' + step).style.display = 'block';
        document.querySelectorAll('.step').forEach((s, i) => {
            s.classList.remove('active', 'done');
            if (i + 1 < step) s.classList.add('done');
            else if (i + 1 === step) s.classList.add('active');
        });
        currentStep = step;
    }

    function prevStep(current) {
        showStep(current - 1);
    }

    async function submitStep(stage) {
        const me = await api('/auth/me');
        if (me.error) { window.location = '/login'; return; }

        const teams = await api('/teams/my');
        if (!teams || teams.length === 0) { alert('No team found'); return; }
        teamData = teams[0];

        const data = { teamId: teamData.id, hackathonId: teamData.hackathonId, stage: stage };
        if (stage === 1) {
            data.videoUrl = document.getElementById('videoUrl1').value;
            data.pptUrl = document.getElementById('pptUrl1').value;
            if (!data.videoUrl || !data.pptUrl) { alert('Fill all required fields'); return; }
        } else if (stage === 2) {
            data.githubUrl = document.getElementById('githubUrl').value;
            data.deployUrl = document.getElementById('deployUrl').value;
            if (!data.githubUrl || !data.deployUrl) { alert('Fill all required fields'); return; }
        } else if (stage === 3) {
            data.videoUrl = document.getElementById('videoUrl3').value;
            data.pptUrl = document.getElementById('pptUrl3').value;
            if (!data.videoUrl || !data.pptUrl) { alert('Fill all required fields'); return; }
        }

        const result = await api('/submissions/submit', { method: 'POST', body: JSON.stringify(data) });
        if (result.error) { alert(result.error); return; }

        if (stage < 3) {
            alert('Stage ' + stage + ' submitted! Move to the next stage after admin approval.');
            showStep(stage + 1);
        } else {
            document.querySelectorAll('.step-panel').forEach(p => p.style.display = 'none');
            document.getElementById('successState').style.display = 'block';
        }
    }

    // Load current team state
    (async () => {
        const me = await api('/auth/me');
        if (me.error) { window.location = '/login'; return; }
        const teams = await api('/teams/my');
        if (teams && teams.length > 0) {
            teamData = teams[0];
            showStep(teamData.stageStatus);
        }
    })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
