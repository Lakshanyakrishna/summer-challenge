<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Teams - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people"></i>My Teams</h2>
            <div class="d-flex gap-2">
                <a th:href="@{/teams/create}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Create Team</a>
                <a th:href="@{/teams/join}" class="btn btn-outline-primary"><i class="bi bi-box-arrow-in-right me-1"></i>Join Team</a>
            </div>
        </div>

        <div class="hackathon-grid">
            <div th:each="team : ${teams}" class="card">
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3 mb-2">
                        <div style="width: 40px; height: 40px; border-radius: 10px; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #000; font-size: 1rem;"><i class="bi bi-people-fill"></i></div>
                        <div>
                            <h5 class="mb-0" th:text="${team.teamName}">Team Name</h5>
                            <small style="color: var(--text-muted);"><i class="bi bi-trophy me-1"></i><span th:text="${team.hackathon.title}">Hackathon</span></small>
                        </div>
                    </div>
                    <div class="gradient-divider my-2"></div>
                    <p style="color: var(--text-secondary); font-size: 0.88rem;"><i class="bi bi-person-fill me-1" style="color: var(--neon-cyan);"></i>Leader: <strong th:text="${team.leader.name}">Leader</strong></p>
                    <p style="color: var(--text-secondary); font-size: 0.88rem;"><i class="bi bi-people-fill me-1" style="color: var(--neon-purple);"></i>Members: <span th:text="${#sets.size(team.members)}">0</span></p>
                    <div class="d-flex flex-wrap gap-1 mt-2">
                        <span class="badge" style="background: rgba(0, 240, 255, 0.1); color: var(--neon-cyan);" th:each="m : ${team.members}" th:if="${m.id != team.leader.id}" th:text="${m.name}">member</span>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(teams)}" class="empty-state">
            <i class="bi bi-people"></i>
            <p>You haven't created any teams yet.</p>
            <div class="d-flex gap-2 justify-content-center">
                <a th:href="@{/teams/create}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Create Team</a>
                <a th:href="@{/teams/join}" class="btn btn-outline-primary"><i class="bi bi-box-arrow-in-right me-1"></i>Join Team</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
