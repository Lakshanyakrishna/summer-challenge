<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Hackathons - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container" style="padding: 40px 0 60px;">
        <div class="d-flex justify-content-between align-items-center mb-4 animate-in">
            <h2 style="margin: 0;"><i class="bi bi-calendar-check"></i> Manage Hackathons</h2>
            <button class="btn btn-primary" onclick="showCreateModal()"><i class="bi bi-plus-lg"></i> Create Hackathon</button>
        </div>
        <div class="glass-panel animate-in-delay-1">
            <table class="table">
                <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Dates</th><th>Fee</th><th></th></tr></thead>
                <tbody id="hackathonsBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Create Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-lg);">
                <div class="modal-header" style="border-bottom: 1px solid var(--border-color);">
                    <h5 class="modal-title"><i class="bi bi-plus-circle" style="color: var(--neon-cyan);"></i> Create Hackathon</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" id="hTitle" class="form-control" placeholder="Hackathon name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="hDesc" class="form-control" rows="3" placeholder="Describe the hackathon"></textarea>
                    </div>
                    <div class="grid-2">
                        <div class="mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" id="hStart" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" id="hEnd" class="form-control">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" id="hLoc" class="form-control" placeholder="Online / City">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Registration Fee (₹)</label>
                            <input type="number" id="hFee" class="form-control" value="249">
                        </div>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid var(--border-color);">
                    <button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-success btn-lg" onclick="createHackathon()"><i class="bi bi-check-lg"></i> Create</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    function api(path, opts = {}) {
        return fetch('/api' + path, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } }).then(r => r.json());
    }

    function showCreateModal() {
        const modal = new bootstrap.Modal(document.getElementById('createModal'));
        document.getElementById('hTitle').value = '';
        document.getElementById('hDesc').value = '';
        document.getElementById('hStart').value = '';
        document.getElementById('hEnd').value = '';
        document.getElementById('hLoc').value = '';
        document.getElementById('hFee').value = '249';
        modal.show();
    }

    async function createHackathon() {
        const data = {
            title: document.getElementById('hTitle').value,
            description: document.getElementById('hDesc').value,
            startDate: document.getElementById('hStart').value,
            endDate: document.getElementById('hEnd').value,
            location: document.getElementById('hLoc').value,
            registrationFee: parseFloat(document.getElementById('hFee').value) || 249
        };
        if (!data.title || !data.startDate || !data.endDate) { alert('Fill required fields'); return; }
        await fetch('/api/admin/hackathons', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
        loadHackathons();
    }

    async function deleteHackathon(id) {
        if (!confirm('Delete this hackathon?')) return;
        await fetch('/api/admin/hackathons/' + id, { method: 'DELETE' });
        loadHackathons();
    }

    async function loadHackathons() {
        const hackathons = await api('/hackathons');
        const tbody = document.getElementById('hackathonsBody');
        tbody.innerHTML = hackathons.map(h =>
            '<tr>' +
            '<td style="color: var(--text-muted);">' + h.id + '</td>' +
            '<td style="color: var(--neon-cyan); font-weight: 600;">' + h.title + '</td>' +
            '<td><span class="badge ' + (h.status === 'UPCOMING' ? 'badge-upcoming' : h.status === 'ONGOING' ? 'badge-ongoing' : 'badge-closed') + '">' + h.status + '</span></td>' +
            '<td style="color: var(--text-muted);">' + (h.startDate ? new Date(h.startDate).toLocaleDateString('en-IN', {month:'short', day:'numeric'}) : 'TBD') + '</td>' +
            '<td>₹' + h.registrationFee + '</td>' +
            '<td><button class="btn btn-sm btn-danger" onclick="deleteHackathon(' + h.id + ')"><i class="bi bi-trash"></i></button></td>' +
            '</tr>'
        ).join('');
    }

    loadHackathons();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
