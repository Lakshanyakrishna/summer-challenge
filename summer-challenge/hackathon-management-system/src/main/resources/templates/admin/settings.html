<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Settings - Admin - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container" style="padding: 40px 0 60px;">
        <div class="animate-in">
            <h2><i class="bi bi-gear-wide-connected"></i> Super Admin Control Panel</h2>
            <p class="text-muted">Configure all platform settings without touching code.</p>
        </div>
        <div class="row g-4 mt-3">
            <div class="col-md-3">
                <div class="glass-panel p-3 animate-in-delay-1">
                    <nav class="nav flex-column settings-nav">
                        <a class="nav-link active" data-section="team" href="#"><i class="bi bi-people"></i> Team</a>
                        <a class="nav-link" data-section="registration" href="#"><i class="bi bi-door-open"></i> Registration</a>
                        <a class="nav-link" data-section="payment" href="#"><i class="bi bi-credit-card"></i> Payment</a>
                        <a class="nav-link" data-section="submission" href="#"><i class="bi bi-upload"></i> Submission</a>
                        <a class="nav-link" data-section="stage" href="#"><i class="bi bi-ladder"></i> Stages</a>
                        <a class="nav-link" data-section="prizes" href="#"><i class="bi bi-trophy"></i> Prizes</a>
                        <a class="nav-link" data-section="problems" href="#"><i class="bi bi-journal-code"></i> Problems</a>
                        <a class="nav-link" data-section="announcements" href="#"><i class="bi bi-megaphone"></i> Announcements</a>
                        <a class="nav-link" data-section="users" href="#"><i class="bi bi-person-badge"></i> Users</a>
                        <a class="nav-link" data-section="platform" href="#"><i class="bi bi-globe"></i> Platform</a>
                    </nav>
                </div>
            </div>
            <div class="col-md-9">
                <div id="contentArea"></div>
            </div>
        </div>
    </div>
    <script>
    function api(path, opts = {}) {
        return fetch('/api' + path, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } }).then(r => r.json());
    }

    const sections = ['team', 'registration', 'payment', 'submission', 'stage', 'prizes', 'problems', 'announcements', 'platform', 'users'];
    let currentSection = 'team';

    document.querySelectorAll('.settings-nav .nav-link').forEach(link => {
        link.addEventListener('click', e => {
            e.preventDefault();
            document.querySelectorAll('.settings-nav .nav-link').forEach(l => l.classList.remove('active'));
            link.classList.add('active');
            loadSection(link.dataset.section);
        });
    });

    function loadSection(section) {
        currentSection = section;
        const area = document.getElementById('contentArea');
        area.innerHTML = '<div class="text-center py-5"><div class="spinner-border" style="color:var(--neon-cyan);"></div><p class="mt-2 text-muted">Loading...</p></div>';
        if (section === 'stage') return loadStageManagement(area);
        if (section === 'prizes') return loadPrizeManagement(area);
        if (section === 'problems') return loadProblemManagement(area);
        if (section === 'announcements') return loadAnnouncementManagement(area);
        if (section === 'users') return loadUserManagement(area);
        loadSettingsSection(section, area);
    }

    async function loadSettingsSection(category, area) {
        const settings = await api('/admin/settings/' + category);
        let html = '<form id="settingsForm" class="glass-panel p-4 animate-in">';
        html += '<h4 class="mb-4" style="color:var(--neon-cyan);text-transform:capitalize;"><i class="bi bi-gear"></i> ' + category + ' Settings</h4>';
        settings.forEach(s => {
            const val = s.settingValue || '';
            const label = s.label || s.settingKey;
            const id = 'set_' + s.settingKey.replace(/[^a-zA-Z0-9]/g, '_');
            html += '<div class="mb-3">';
            html += '<label class="form-label" for="' + id + '">' + label + '</label>';
            if (s.fieldType === 'boolean') {
                const checked = val === 'true' ? 'checked' : '';
                html += '<div class="form-check form-switch">';
                html += '<input class="form-check-input" type="checkbox" id="' + id + '" ' + checked + '>';
                html += '</div>';
            } else if (s.fieldType === 'number') {
                html += '<input type="number" class="form-control" id="' + id + '" value="' + val + '">';
            } else if (s.fieldType === 'datetime') {
                html += '<input type="datetime-local" class="form-control" id="' + id + '" value="' + val + '">';
            } else {
                html += '<input type="' + (s.fieldType || 'text') + '" class="form-control" id="' + id + '" value="' + val + '">';
            }
            html += '</div>';
        });
        html += '<button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check-lg"></i> Save Changes</button>';
        html += '</form>';
        area.innerHTML = html;

        document.getElementById('settingsForm').addEventListener('submit', async e => {
            e.preventDefault();
            for (const s of settings) {
                const id = 'set_' + s.settingKey.replace(/[^a-zA-Z0-9]/g, '_');
                let val;
                const el = document.getElementById(id);
                if (!el) continue;
                if (el.type === 'checkbox') val = el.checked ? 'true' : 'false';
                else val = el.value;
                await api('/admin/settings/' + s.settingKey, { method: 'PUT', body: JSON.stringify({ value: val }) });
            }
            showToast('Settings saved!');
        });
    }

    async function loadStageManagement(area) {
        const stages = await api('/admin/stages');
        let html = '<div class="glass-panel p-4 animate-in">';
        html += '<div class="d-flex justify-content-between align-items-center mb-4">';
        html += '<h4 style="color:var(--neon-cyan);"><i class="bi bi-ladder"></i> Stage Definitions</h4>';
        html += '<button class="btn btn-primary btn-sm" onclick="showStageModal()"><i class="bi bi-plus-lg"></i> Add Stage</button>';
        html += '</div>';
        html += '<table class="table"><thead><tr><th>#</th><th>Name</th><th>Required Fields</th><th>Active</th><th></th></tr></thead><tbody>';
        stages.forEach(s => {
            html += '<tr><td>' + s.stageNumber + '</td><td>' + s.stageName + '</td>';
            html += '<td style="font-family:monospace;font-size:0.85rem;color:var(--text-muted);">' + (s.requiredFields || '-') + '</td>';
            html += '<td>' + (s.active ? '<span class="badge badge-ongoing">Active</span>' : '<span class="badge badge-closed">Inactive</span>') + '</td>';
            html += '<td><button class="btn btn-sm btn-ghost" onclick="editStage(' + s.id + ',\'' + s.stageName + '\',' + s.stageNumber + ',\'' + (s.requiredFields||'') + '\',' + s.active + ')"><i class="bi bi-pencil"></i></button> ';
            html += '<button class="btn btn-sm btn-danger" onclick="deleteStage(' + s.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
        });
        html += '</tbody></table></div>';
        html += '<div class="glass-panel p-4 mt-4"><h5>Available Fields</h5><p class="text-muted">Required fields format: comma-separated. Options: <code>videoUrl</code>, <code>pptUrl</code>, <code>githubUrl</code>, <code>description</code>, <code>fileUrl</code>, <code>demoUrl</code></p></div>';
        area.innerHTML = html;
    }

    function showStageModal(stage) {
        const title = stage ? 'Edit Stage' : 'Add Stage';
        const btn = stage ? 'Update' : 'Create';
        const sn = stage ? stage.stageNumber : '';
        const nm = stage ? stage.stageName : '';
        const rf = stage ? stage.requiredFields : '';
        const act = stage ? stage.active : true;
        const html = '<div class="modal fade" id="stageModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content" style="background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-lg);">' +
            '<div class="modal-header" style="border-bottom:1px solid var(--border-color);"><h5 class="modal-title"><i class="bi bi-ladder" style="color:var(--neon-cyan);"></i> ' + title + '</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>' +
            '<div class="modal-body">' +
            '<div class="mb-3"><label class="form-label">Stage Number</label><input type="number" class="form-control" id="stageNumber" value="' + sn + '"></div>' +
            '<div class="mb-3"><label class="form-label">Stage Name</label><input class="form-control" id="stageName" value="' + nm + '"></div>' +
            '<div class="mb-3"><label class="form-label">Required Fields (comma-separated)</label><input class="form-control" id="stageFields" value="' + rf + '"></div>' +
            '<div class="mb-3"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="stageActive" ' + (act ? 'checked' : '') + '><label class="form-check-label">Active</label></div></div>' +
            '</div>' +
            '<div class="modal-footer" style="border-top:1px solid var(--border-color);"><button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success btn-lg" onclick="saveStage(' + (stage ? stage.id : '') + ')"><i class="bi bi-check-lg"></i> ' + btn + '</button></div></div></div></div>';
        const existing = document.getElementById('stageModal');
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', html);
        new bootstrap.Modal(document.getElementById('stageModal')).show();
    }

    window.showStageModal = showStageModal;

    async function saveStage(id) {
        const data = {
            stageNumber: parseInt(document.getElementById('stageNumber').value),
            stageName: document.getElementById('stageName').value,
            requiredFields: document.getElementById('stageFields').value,
            active: document.getElementById('stageActive').checked
        };
        if (id) {
            await api('/admin/stages/' + id, { method: 'PUT', body: JSON.stringify(data) });
        } else {
            await api('/admin/stages', { method: 'POST', body: JSON.stringify(data) });
        }
        bootstrap.Modal.getInstance(document.getElementById('stageModal')).hide();
        loadSection('stages');
    }

    async function editStage(id, name, num, fields, active) {
        showStageModal({ id, stageName: name, stageNumber: num, requiredFields: fields, active });
    }

    async function deleteStage(id) {
        if (!confirm('Delete this stage?')) return;
        await api('/admin/stages/' + id, { method: 'DELETE' });
        loadSection('stages');
    }

    async function loadPrizeManagement(area) {
        const prizes = await api('/admin/prizes');
        let html = '<div class="glass-panel p-4 animate-in">';
        html += '<div class="d-flex justify-content-between align-items-center mb-4">';
        html += '<h4 style="color:var(--neon-cyan);"><i class="bi bi-trophy"></i> Prize Management</h4>';
        html += '<button class="btn btn-primary btn-sm" onclick="showPrizeModal()"><i class="bi bi-plus-lg"></i> Add Prize</button>';
        html += '</div>';
        html += '<table class="table"><thead><tr><th>Rank</th><th>Title</th><th>Amount</th><th>Type</th><th>Description</th><th></th></tr></thead><tbody>';
        prizes.forEach(p => {
            html += '<tr><td>' + (p.rank || '-') + '</td><td style="color:var(--neon-purple);">' + p.title + '</td>';
            html += '<td>₹' + p.amount + '</td><td>' + (p.type || '-') + '</td><td style="color:var(--text-muted);font-size:0.85rem;">' + (p.description || '-') + '</td>';
            html += '<td><button class="btn btn-sm btn-ghost" onclick="showPrizeModal(' + p.id + ',\'' + p.title.replace(/'/g,"\\'") + '\',' + p.amount + ',\'' + (p.description||'').replace(/'/g,"\\'") + '\',\'' + (p.type||'') + '\',' + (p.rank||0) + ')"><i class="bi bi-pencil"></i></button> ';
            html += '<button class="btn btn-sm btn-danger" onclick="deletePrize(' + p.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
        });
        html += '</tbody></table></div>';
        area.innerHTML = html;
    }

    function showPrizeModal(id, title, amount, description, type, rank) {
        const isEdit = !!id;
        const modalHtml = '<div class="modal fade" id="prizeModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content" style="background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-lg);">' +
            '<div class="modal-header" style="border-bottom:1px solid var(--border-color);"><h5 class="modal-title"><i class="bi bi-trophy" style="color:var(--neon-purple);"></i> ' + (isEdit ? 'Edit Prize' : 'Add Prize') + '</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>' +
            '<div class="modal-body">' +
            '<div class="mb-3"><label class="form-label">Title</label><input class="form-control" id="prizeTitle" value="' + (title||'') + '"></div>' +
            '<div class="grid-2"><div class="mb-3"><label class="form-label">Amount (₹)</label><input type="number" class="form-control" id="prizeAmount" value="' + (amount||'') + '"></div>' +
            '<div class="mb-3"><label class="form-label">Rank</label><input type="number" class="form-control" id="prizeRank" value="' + (rank||'') + '"></div></div>' +
            '<div class="mb-3"><label class="form-label">Type</label><select class="form-select" id="prizeType"><option value="cash" ' + (type==='cash'?'selected':'') + '>Cash</option><option value="voucher" ' + (type==='voucher'?'selected':'') + '>Voucher</option><option value="merchandise" ' + (type==='merchandise'?'selected':'') + '>Merchandise</option><option value="other" ' + (type==='other'?'selected':'') + '>Other</option></select></div>' +
            '<div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="prizeDesc" rows="2">' + (description||'') + '</textarea></div>' +
            '</div>' +
            '<div class="modal-footer" style="border-top:1px solid var(--border-color);"><button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success btn-lg" onclick="savePrize(' + (id ? id : '') + ')"><i class="bi bi-check-lg"></i> ' + (isEdit ? 'Update' : 'Create') + '</button></div></div></div></div>';
        const existing = document.getElementById('prizeModal');
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        new bootstrap.Modal(document.getElementById('prizeModal')).show();
    }

    window.showPrizeModal = showPrizeModal;

    async function savePrize(id) {
        const data = {
            title: document.getElementById('prizeTitle').value,
            amount: parseFloat(document.getElementById('prizeAmount').value) || 0,
            rank: parseInt(document.getElementById('prizeRank').value) || 0,
            type: document.getElementById('prizeType').value,
            description: document.getElementById('prizeDesc').value
        };
        if (!data.title) { alert('Title is required'); return; }
        if (id) {
            await api('/admin/prizes/' + id, { method: 'PUT', body: JSON.stringify(data) });
        } else {
            await api('/admin/prizes', { method: 'POST', body: JSON.stringify(data) });
        }
        bootstrap.Modal.getInstance(document.getElementById('prizeModal')).hide();
        loadSection('prizes');
    }

    async function deletePrize(id) {
        if (!confirm('Delete this prize?')) return;
        await api('/admin/prizes/' + id, { method: 'DELETE' });
        loadSection('prizes');
    }

    async function loadAnnouncementManagement(area) {
        const announcements = await api('/admin/announcements');
        let html = '<div class="glass-panel p-4 animate-in">';
        html += '<div class="d-flex justify-content-between align-items-center mb-4">';
        html += '<h4 style="color:var(--neon-cyan);"><i class="bi bi-megaphone"></i> Announcements</h4>';
        html += '<button class="btn btn-primary btn-sm" onclick="showAnnouncementModal()"><i class="bi bi-plus-lg"></i> New Announcement</button>';
        html += '</div>';
        html += '<div class="announcement-list">';
        if (announcements.length === 0) {
            html += '<p class="text-muted text-center py-4">No announcements yet.</p>';
        } else {
            announcements.forEach(a => {
                const typeIcon = a.type === 'warning' ? 'bi-exclamation-triangle' : a.type === 'success' ? 'bi-check-circle' : 'bi-info-circle';
                const typeColor = a.type === 'warning' ? 'var(--warning)' : a.type === 'success' ? 'var(--success)' : 'var(--neon-cyan)';
                html += '<div class="announcement-card" style="border-left:3px solid ' + typeColor + ';padding:12px 16px;margin-bottom:12px;background:rgba(255,255,255,0.03);border-radius:var(--radius-sm);">';
                html += '<div class="d-flex justify-content-between"><div><i class="bi ' + typeIcon + '" style="color:' + typeColor + ';margin-right:8px;"></i>';
                html += '<strong>' + a.title + '</strong> <span class="text-muted">' + new Date(a.createdAt).toLocaleDateString('en-IN', {month:'short', day:'numeric', year:'numeric'}) + '</span></div>';
                html += '<button class="btn btn-sm btn-danger" onclick="deleteAnnouncement(' + a.id + ')"><i class="bi bi-trash"></i></button></div>';
                html += '<p class="mt-2 mb-0" style="color:var(--text-muted);font-size:0.9rem;">' + (a.message || '') + '</p>';
                html += '</div>';
            });
        }
        html += '</div></div>';
        area.innerHTML = html;
    }

    function showAnnouncementModal() {
        const html = '<div class="modal fade" id="announceModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content" style="background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-lg);">' +
            '<div class="modal-header" style="border-bottom:1px solid var(--border-color);"><h5 class="modal-title"><i class="bi bi-megaphone" style="color:var(--neon-cyan);"></i> New Announcement</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>' +
            '<div class="modal-body">' +
            '<div class="mb-3"><label class="form-label">Title</label><input class="form-control" id="annTitle"></div>' +
            '<div class="mb-3"><label class="form-label">Message</label><textarea class="form-control" id="annMsg" rows="3"></textarea></div>' +
            '<div class="mb-3"><label class="form-label">Type</label><select class="form-select" id="annType"><option value="info">Info</option><option value="warning">Warning</option><option value="success">Success</option></select></div>' +
            '<div class="mb-3"><label class="form-label">Schedule (optional)</label><input type="datetime-local" class="form-control" id="annSchedule"></div>' +
            '</div>' +
            '<div class="modal-footer" style="border-top:1px solid var(--border-color);"><button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success btn-lg" onclick="saveAnnouncement()"><i class="bi bi-check-lg"></i> Publish</button></div></div></div></div>';
        const existing = document.getElementById('announceModal');
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', html);
        new bootstrap.Modal(document.getElementById('announceModal')).show();
    }

    window.showAnnouncementModal = showAnnouncementModal;

    async function saveAnnouncement() {
        const data = {
            title: document.getElementById('annTitle').value,
            message: document.getElementById('annMsg').value,
            type: document.getElementById('annType').value
        };
        const scheduled = document.getElementById('annSchedule').value;
        if (scheduled) data.scheduledAt = scheduled;
        if (!data.title) { alert('Title is required'); return; }
        await api('/admin/announcements', { method: 'POST', body: JSON.stringify(data) });
        bootstrap.Modal.getInstance(document.getElementById('announceModal')).hide();
        loadSection('announcements');
    }

    async function deleteAnnouncement(id) {
        if (!confirm('Delete this announcement?')) return;
        await api('/admin/announcements/' + id, { method: 'DELETE' });
        loadSection('announcements');
    }

    // ===== User Management =====
    async function loadUserManagement(area) {
        const users = await api('/admin/users');
        let html = '<div class="glass-panel p-4 animate-in">';
        html += '<h4 class="mb-4" style="color:var(--neon-cyan);"><i class="bi bi-person-badge"></i> User Management</h4>';
        html += '<div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Paid</th><th>Team</th><th></th></tr></thead><tbody>';
        users.forEach(u => {
            html += '<tr><td style="color:var(--text-muted);font-size:0.85rem;">' + u.id + '</td>';
            html += '<td>' + u.name + '</td>';
            html += '<td style="color:var(--text-muted);font-size:0.85rem;">' + u.email + '</td>';
            html += '<td>' + (u.role === 'ADMIN' ? '<span class="badge badge-ongoing">Admin</span>' : '<span class="badge badge-upcoming">Participant</span>') + '</td>';
            html += '<td>' + (u.hasPaid ? '<span style="color:var(--success);">Yes</span>' : '<span style="color:var(--text-muted);">No</span>') + '</td>';
            html += '<td style="font-size:0.85rem;color:var(--text-muted);">' + (u.teamId || '-') + '</td>';
            html += '<td>' + (u.role !== 'ADMIN' ? '<button class="btn btn-sm btn-danger" onclick="deleteUser(' + u.id + ',\'' + u.name.replace(/'/g,"\\'") + '\')"><i class="bi bi-trash"></i></button>' : '') + '</td></tr>';
        });
        html += '</tbody></table></div></div>';
        area.innerHTML = html;
    }

    async function deleteUser(id, name) {
        if (!confirm('Delete user "' + name + '" permanently?')) return;
        const res = await api('/admin/users/' + id, { method: 'DELETE' });
        if (res.error) { alert(res.error); return; }
        showToast('User deleted');
        loadSection('users');
    }

    window.deleteUser = deleteUser;

    // ===== Problem Statements =====
    async function loadProblemManagement(area) {
        const [problems, hackathons] = await Promise.all([
            api('/admin/problems'),
            api('/hackathons')
        ]);
        let html = '<div class="glass-panel p-4 animate-in">';
        html += '<div class="d-flex justify-content-between align-items-center mb-4">';
        html += '<h4 style="color:var(--neon-cyan);"><i class="bi bi-journal-code"></i> Problem Statements</h4>';
        html += '<button class="btn btn-primary btn-sm" onclick="showProblemModal()"><i class="bi bi-plus-lg"></i> Add Problem</button>';
        html += '</div>';
        html += '<div class="mb-3"><label class="form-label">Filter by Hackathon</label><select class="form-select" id="problemHackathonFilter" onchange="filterProblems()">';
        html += '<option value="all">All Hackathons</option>';
        hackathons.forEach(h => html += '<option value="' + h.id + '">' + h.title + '</option>');
        html += '</select></div>';
        html += '<table class="table" id="problemTable"><thead><tr><th>ID</th><th>Title</th><th>Difficulty</th><th>Tech Stack</th><th>Hackathon</th><th></th></tr></thead><tbody>';
        problems.forEach(p => {
            const h = hackathons.find(x => x.id == p.hackathonId);
            html += '<tr class="problem-row" data-hackathon="' + p.hackathonId + '"><td style="color:var(--text-muted);font-size:0.85rem;">' + p.id + '</td>';
            html += '<td style="color:var(--neon-cyan);">' + p.title + '</td>';
            html += '<td><span class="badge ' + (p.difficulty === 'hard' ? 'badge-closed' : p.difficulty === 'medium' ? 'badge-ongoing' : 'badge-upcoming') + '">' + (p.difficulty||'medium') + '</span></td>';
            html += '<td style="color:var(--text-muted);font-size:0.85rem;">' + (p.techStack || '-') + '</td>';
            html += '<td style="font-size:0.85rem;">' + (h ? h.title : 'N/A') + '</td>';
            html += '<td><button class="btn btn-sm btn-ghost" onclick="editProblem(' + p.id + ')"><i class="bi bi-pencil"></i></button> ';
            html += '<button class="btn btn-sm btn-danger" onclick="deleteProblem(' + p.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
        });
        html += '</tbody></table></div>';
        area.innerHTML = html;
    }

    window.filterProblems = function() {
        const val = document.getElementById('problemHackathonFilter').value;
        document.querySelectorAll('.problem-row').forEach(r => {
            r.style.display = val === 'all' || r.dataset.hackathon === val ? '' : 'none';
        });
    };

    async function showProblemModal(problem) {
        const isEdit = !!problem;
        const hackathons = await api('/hackathons');
        const html = '<div class="modal fade" id="problemModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content" style="background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-lg);">' +
            '<div class="modal-header" style="border-bottom:1px solid var(--border-color);"><h5 class="modal-title"><i class="bi bi-journal-code" style="color:var(--neon-cyan);"></i> ' + (isEdit ? 'Edit Problem' : 'Add Problem Statement') + '</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>' +
            '<div class="modal-body">' +
            '<div class="mb-3"><label class="form-label">Hackathon</label><select class="form-select" id="probHackathon">' +
            hackathons.map(h => '<option value="' + h.id + '" ' + (isEdit && problem.hackathonId == h.id ? 'selected' : '') + '>' + h.title + '</option>').join('') +
            '</select></div>' +
            '<div class="mb-3"><label class="form-label">Title</label><input class="form-control" id="probTitle" value="' + (isEdit ? (problem.title||'').replace(/'/g,"\\'") : '') + '"></div>' +
            '<div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="probDesc" rows="2">' + (isEdit ? (problem.description||'').replace(/'/g,"\\'") : '') + '</textarea></div>' +
            '<div class="grid-2"><div class="mb-3"><label class="form-label">Difficulty</label><select class="form-select" id="probDifficulty"><option value="easy" ' + (isEdit && problem.difficulty==='easy'?'selected':'') + '>Easy</option><option value="medium" ' + (isEdit && problem.difficulty==='medium'?'selected':'') + '>Medium</option><option value="hard" ' + (isEdit && problem.difficulty==='hard'?'selected':'') + '>Hard</option></select></div>' +
            '<div class="mb-3"><label class="form-label">Tech Stack</label><input class="form-control" id="probTech" value="' + (isEdit ? (problem.techStack||'').replace(/'/g,"\\'") : '') + '" placeholder="e.g. React, Python, Solidity"></div></div>' +
            '<div class="mb-3"><label class="form-label">Icon</label><select class="form-select" id="probIcon"><option value="bi-robot" ' + (isEdit && problem.icon==='bi-robot'?'selected':'') + '>AI/ML</option><option value="bi-globe" ' + (isEdit && problem.icon==='bi-globe'?'selected':'') + '>Web3</option><option value="bi-phone" ' + (isEdit && problem.icon==='bi-phone'?'selected':'') + '>Mobile</option><option value="bi-cloud" ' + (isEdit && problem.icon==='bi-cloud'?'selected':'') + '>Cloud</option><option value="bi-shield" ' + (isEdit && problem.icon==='bi-shield'?'selected':'') + '>Security</option><option value="bi-journal-code" ' + (isEdit && !problem.icon?'selected':'') + '>General</option></select></div>' +
            '</div>' +
            '<div class="modal-footer" style="border-top:1px solid var(--border-color);"><button class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success btn-lg" onclick="saveProblem(' + (isEdit ? problem.id : '') + ')"><i class="bi bi-check-lg"></i> ' + (isEdit ? 'Update' : 'Create') + '</button></div></div></div></div>';
        const existing = document.getElementById('problemModal');
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', html);
        new bootstrap.Modal(document.getElementById('problemModal')).show();
    }

    window.showProblemModal = showProblemModal;

    async function editProblem(id) {
        const problems = await api('/admin/problems');
        const problem = problems.find(p => p.id == id);
        if (problem) showProblemModal(problem);
    }

    async function saveProblem(id) {
        const data = {
            hackathonId: parseInt(document.getElementById('probHackathon').value),
            title: document.getElementById('probTitle').value,
            description: document.getElementById('probDesc').value,
            difficulty: document.getElementById('probDifficulty').value,
            techStack: document.getElementById('probTech').value,
            icon: document.getElementById('probIcon').value
        };
        if (!data.title) { alert('Title is required'); return; }
        if (id) {
            await api('/admin/problems/' + id, { method: 'PUT', body: JSON.stringify(data) });
        } else {
            await api('/admin/problems', { method: 'POST', body: JSON.stringify(data) });
        }
        bootstrap.Modal.getInstance(document.getElementById('problemModal')).hide();
        loadSection('problems');
    }

    async function deleteProblem(id) {
        if (!confirm('Delete this problem statement?')) return;
        await api('/admin/problems/' + id, { method: 'DELETE' });
        loadSection('problems');
    }

    function showToast(msg) {
        const existing = document.querySelector('.toast-container');
        if (existing) existing.remove();
        const container = document.createElement('div');
        container.className = 'toast-container';
        container.innerHTML = '<div class="toast glass-panel" style="position:fixed;bottom:20px;right:20px;padding:12px 24px;z-index:9999;color:var(--neon-cyan);border:1px solid var(--neon-cyan);animation:slideUp 0.3s ease;">' + msg + '</div>';
        document.body.appendChild(container);
        setTimeout(() => container.remove(), 3000);
    }

    loadSection('team');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
