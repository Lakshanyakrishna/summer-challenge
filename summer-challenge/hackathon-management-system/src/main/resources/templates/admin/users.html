<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Users - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people-fill"></i>Manage Users</h2>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createUserModal"><i class="bi bi-plus-lg me-1"></i>Add User</button>
        </div>
        <div class="card">
            <div class="card-body p-0">
                <table class="table">
                    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td style="color: var(--text-muted);" th:text="${u.id}">1</td>
                            <td th:text="${u.name}">name</td>
                            <td style="color: var(--text-muted);" th:text="${u.email}">email</td>
                            <td><span class="badge" th:text="${u.role}" th:classappend="${u.role == 'ADMIN' ? 'bg-warning' : 'bg-primary'}">role</span></td>
                            <td><a th:href="@{/admin/users/delete/{id}(id=${u.id})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Delete this user?')"><i class="bi bi-trash"></i></a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="modal fade" id="createUserModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header"><h5 class="modal-title">Add User</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <form th:action="@{/admin/users/create}" method="post">
                        <div class="modal-body">
                            <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" required></div>
                            <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
                            <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
                            <div class="mb-3"><label class="form-label">Role</label>
                                <select name="role" class="form-select" required>
                                    <option value="PARTICIPANT">Participant</option>
                                    <option value="ADMIN">Admin</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Create</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
