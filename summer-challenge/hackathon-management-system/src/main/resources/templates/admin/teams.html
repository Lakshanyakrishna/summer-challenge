<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Teams - Admin - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container py-4">
        <h2><i class="bi bi-people"></i>Manage Teams</h2>
        <div class="card">
            <div class="card-body p-0">
                <table class="table">
                    <thead><tr><th>ID</th><th>Team</th><th>Code</th><th>Leader</th><th>Hackathon</th><th>Members</th><th>Stage</th><th></th></tr></thead>
                    <tbody id="teamsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
    function api(path, opts = {}) {
        return fetch('/api' + path, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } }).then(r => r.json());
    }

    async function loadTeams() {
        const teams = await api('/admin/teams');
        const tbody = document.getElementById('teamsBody');
        tbody.innerHTML = teams.map(t => {
            const stageOpts = [1,2,3].map(s =>
                '<option value="' + s + '"' + (s === t.stageStatus ? ' selected' : '') + '>Stage ' + s + '</option>'
            ).join('');
            return '<tr>' +
                '<td style="color:var(--text-muted)">' + t.id + '</td>' +
                '<td style="color:var(--neon-cyan)">' + t.teamName + '</td>' +
                '<td style="font-family:monospace;letter-spacing:2px">' + t.teamCode + '</td>' +
                '<td>' + t.leaderName + '</td>' +
                '<td>' + t.hackathonTitle + '</td>' +
                '<td>' + t.memberCount + '</td>' +
                '<td><span class="badge bg-primary">Stage ' + t.stageStatus + '</span></td>' +
                '<td>' +
                '<select class="form-select form-select-sm d-inline-block w-auto" id="stageSel_' + t.id + '">' + stageOpts + '</select> ' +
                '<button class="btn btn-sm btn-outline-primary" onclick="promote(' + t.id + ')">Promote</button>' +
                '</td>' +
                '</tr>';
        }).join('');
    }

    async function promote(id) {
        const stage = parseInt(document.getElementById('stageSel_' + id).value);
        await api('/admin/teams/' + id + '/promote', { method: 'POST', body: JSON.stringify({ stage: stage }) });
        loadTeams();
    }

    loadTeams();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
