<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Evaluations - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container py-4">
        <h2><i class="bi bi-check2-square"></i>Admin Evaluations</h2>

        <div class="card mb-4">
            <div class="card-body d-flex gap-2 align-items-center">
                <span style="color: var(--text-secondary);">Filter by stage:</span>
                <a th:href="@{/admin/evaluations(stage='STAGE_1')}" class="btn btn-sm" th:classappend="${currentStage == 'STAGE_1' ? 'btn-primary' : 'btn-outline-primary'}">Stage 1</a>
                <a th:href="@{/admin/evaluations(stage='STAGE_2')}" class="btn btn-sm" th:classappend="${currentStage == 'STAGE_2' ? 'btn-primary' : 'btn-outline-primary'}">Stage 2</a>
                <a th:href="@{/admin/evaluations(stage='FINAL_PITCH')}" class="btn btn-sm" th:classappend="${currentStage == 'FINAL_PITCH' ? 'btn-primary' : 'btn-outline-primary'}">Final Pitch</a>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-list-check me-1"></i><span th:text="${currentStage.replace('_', ' ')}">Stage</span> Submissions</span>
                <span class="badge bg-primary" th:text="${#lists.size(submissions)} + ' total'">0</span>
            </div>
            <div class="card-body p-0">
                <table class="table">
                    <thead><tr><th>Team</th><th>Hackathon</th><th>GitHub</th><th>Demo</th><th>Status</th><th>Submitted</th><th>Actions</th></tr></thead>
                    <tbody>
                        <tr th:each="s : ${submissions}">
                            <td><strong th:text="${s.team.teamName}">team</strong></td>
                            <td style="color: var(--text-muted);" th:text="${s.hackathon.title}">hackathon</td>
                            <td><a th:href="${s.githubLink}" target="_blank" class="btn btn-sm btn-outline-primary"><i class="bi bi-github"></i></a></td>
                            <td><a th:href="${s.demoLink}" target="_blank" class="btn btn-sm btn-outline-info" th:if="${s.demoLink}"><i class="bi bi-play-circle"></i></a></td>
                            <td>
                                <span class="badge" th:text="${s.evaluationStatus}"
                                      th:classappend="${s.evaluationStatus == 'APPROVED' ? 'bg-success' : s.evaluationStatus == 'REJECTED' ? 'bg-danger' : 'bg-secondary'}">status</span>
                            </td>
                            <td style="color: var(--text-muted); font-size: 0.85rem;" th:text="${#temporals.format(s.submittedAt, 'MMM dd, HH:mm')}">date</td>
                            <td>
                                <div th:if="${s.evaluationStatus == 'PENDING'}" class="d-flex gap-1">
                                    <button class="btn btn-sm btn-success" th:onclick="'approveForm(' + ${s.id} + ')'"><i class="bi bi-check-lg"></i></button>
                                    <button class="btn btn-sm btn-danger" th:onclick="'rejectForm(' + ${s.id} + ')'"><i class="bi bi-x-lg"></i></button>
                                </div>
                                <span th:if="${s.evaluationStatus != 'PENDING'}" style="color: var(--text-muted); font-size: 0.85rem;" th:text="${s.evaluatedAt != null ? #temporals.format(s.evaluatedAt, 'MMM dd, HH:mm') : ''}">evaluated</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(submissions)}" class="empty-state">
            <i class="bi bi-inbox"></i>
            <p>No submissions in this stage.</p>
        </div>

        <!-- Approve Modal -->
        <div class="modal fade" id="approveModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title"><i class="bi bi-check-circle text-success me-1"></i>Approve Submission</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form method="post" id="approveForm"><div class="modal-body">
                <div class="mb-3"><label class="form-label">Feedback (optional)</label><textarea name="feedback" class="form-control" rows="3" placeholder="Add feedback for the team..."></textarea></div>
            </div><div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i>Approve</button>
            </div></form>
        </div></div></div>

        <!-- Reject Modal -->
        <div class="modal fade" id="rejectModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
            <div class="modal-header"><h5 class="modal-title"><i class="bi bi-x-circle text-danger me-1"></i>Reject Submission</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form method="post" id="rejectForm"><div class="modal-body">
                <div class="mb-3"><label class="form-label">Reason for rejection</label><textarea name="feedback" class="form-control" rows="3" placeholder="Explain why this submission is rejected..." required></textarea></div>
            </div><div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-danger"><i class="bi bi-x-lg me-1"></i>Reject</button>
            </div></form>
        </div></div></div>

        <script>
            function approveForm(id) {
                document.getElementById('approveForm').action = '/admin/evaluations/' + id + '/approve';
                new bootstrap.Modal(document.getElementById('approveModal')).show();
            }
            function rejectForm(id) {
                document.getElementById('rejectForm').action = '/admin/evaluations/' + id + '/reject';
                new bootstrap.Modal(document.getElementById('rejectModal')).show();
            }
        </script>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
