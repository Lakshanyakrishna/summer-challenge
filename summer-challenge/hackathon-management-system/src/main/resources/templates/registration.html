<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Registrations - Hackathon')}"></head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container py-4">
        <h2><i class="bi bi-journal-text"></i>My Registrations</h2>

        <div class="card">
            <div class="card-body p-0">
                <table class="table">
                    <thead>
                        <tr><th>Hackathon</th><th>Status</th><th>Payment</th><th>Registered On</th><th>Dates</th><th></th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${registrations}">
                            <td><a th:href="@{/hackathons/{id}(id=${r.hackathon.id})}" th:text="${r.hackathon.title}" style="color: var(--neon-cyan);">title</a></td>
                            <td><span class="badge" th:text="${r.hackathon.status}" th:classappend="${r.hackathon.status == 'UPCOMING' ? 'bg-primary' : r.hackathon.status == 'ONGOING' ? 'bg-success' : 'bg-secondary'}">status</span></td>
                            <td>
                                <span class="badge" th:text="${r.paymentStatus}"
                                      th:classappend="${r.paymentStatus == 'VERIFIED' ? 'bg-success' : r.paymentStatus == 'PENDING' ? 'bg-warning' : 'bg-danger'}">payment</span>
                            </td>
                            <td style="color: var(--text-muted);" th:text="${#temporals.format(r.registrationDate, 'MMM dd, yyyy')}">date</td>
                            <td style="color: var(--text-muted);" th:text="${#temporals.format(r.hackathon.startDate, 'MMM dd')} + ' - ' + ${#temporals.format(r.hackathon.endDate, 'MMM dd, yyyy')}">dates</td>
                            <td>
                                <div class="d-flex gap-1">
                                    <a th:if="${r.paymentStatus == 'PENDING'}" th:href="@{/payments/{id}(id=${r.hackathon.id})}" class="btn btn-sm btn-warning"><i class="bi bi-credit-card me-1"></i>Pay</a>
                                    <a th:if="${r.hackathon.status == 'UPCOMING'}" th:href="@{/registrations/{id}/unregister(id=${r.hackathon.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Unregister from this hackathon?')"><i class="bi bi-x-circle"></i></a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <a th:href="@{/hackathons}" class="btn btn-primary mt-3"><i class="bi bi-search me-1"></i>Browse Hackathons</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
